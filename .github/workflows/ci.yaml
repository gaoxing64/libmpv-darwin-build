name: ci

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Log level"
        required: true
        default: "warning"

jobs:
  ci:
    name: ci
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-15-Readme.md
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v14
        with:
          extra-conf: |
            sandbox = true
            sandbox-fallback = false

      - name: Nix version
        run: nix --version

      - name: Show Nix config
        run: nix config show

      - name: Xcode version
        run: /Applications/Xcode_16.1.0.app/Contents/Developer/usr/bin/xcodebuild -version

      # See ${workspace}/nix/overlays/xcode.md
      - name: Set up Xcode in Nix store
        run: |
          XCODE_APP=$(realpath /Applications/Xcode_16.1.0.app)
          NIX_STORE_PATH="/nix/store/v92p4w6nxhyhq6lv0maq5cbb59mbxw5b-Xcode.app"
          HASH="sha256:d63c91255c8e98603b7f1470067c5225ab673850eed35449f5a0105c936e581c"

          sudo cp -a $XCODE_APP $NIX_STORE_PATH
          sudo sqlite3 /nix/var/nix/db/db.sqlite "INSERT INTO ValidPaths (path,hash,registrationTime) VALUES ('$NIX_STORE_PATH','$HASH',$(date +%s))"

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Determine version
        id: version
        run: |
          case "${GITHUB_REF}" in
          refs/tags/*)
            VERSION=${GITHUB_REF#refs/tags/}
            ;;
          *)
            VERSION=develop
            ;;
          esac

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo ${VERSION}

      - name: Build
        run: |
          VERSION=${{ steps.version.outputs.version }}
          echo \"$VERSION\" > nix/utils/default/version.nix
          nix build -v

      - name: Verify libmpv feature set
        run: |
          set -euo pipefail
          # Unpack the macOS/iOS video artifacts and assert the shipped dylibs
          # really contain H.265/AV1, stats.lua and the loudnorm filter chain.
          shopt -s nullglob
          archives=(result/*.tar.gz)
          if ((${#archives[@]} == 0)); then
            echo "No archives were produced."
            exit 1
          fi
          mkdir -p verify
          for archive in "${archives[@]}"; do
            name=$(basename "$archive" .tar.gz)
            case "$name" in
              *-video-*) ;;
              *) continue ;;
            esac
            dir="verify/$name"
            mkdir -p "$dir"
            tar -xzf "$archive" -C "$dir"
            dylib=$(find "$dir" -name 'libmpv*.dylib' -type f | head -n1)
            if [[ -z "$dylib" ]]; then
              echo "ERROR: no libmpv dylib in $name"
              exit 1
            fi
            # AV1 parser cannot be told apart from the decoder name inside the
            # binary, so assert the flag in the FFmpeg build recipe as well.
            sh scripts/verify_libmpv_artifacts.sh \
              --config-source nix/packages/mk-pkg-ffmpeg/meson.build \
              "$dylib" "$name"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          path: |
            result/*.tar.gz
            result/*.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: true
          files: |
            result/*.tar.gz
            result/*.zip
